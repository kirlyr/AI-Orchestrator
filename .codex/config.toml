# Fallback if you start `codex` directly.
# A smart launcher may override the main model per new task using -m and -c.
model = "gpt-6-luna"
model_reasoning_effort = "low"

[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "low"
max_concurrent_threads_per_session = 2
