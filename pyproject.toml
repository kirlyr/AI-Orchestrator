[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcodex"
version = "0.1.0"
description = "A command-line router for Codex tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
test = ['tomli>=2.0.1; python_version < "3.11"']

[project.scripts]
smartcodex = "smartcodex.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
